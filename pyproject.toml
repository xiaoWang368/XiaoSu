[project]
name = "xiaosu"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "colorlog>=6.12.0",
    "dingtalk-stream>=0.24.3",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "jieba>=0.42.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "mammoth>=1.12.1",
    "minio>=7.2.20",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0.1",
    "pymilvus-model>=0.3.2",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.52.3",
]
#将uv的默认镜像换成阿里云的
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
